 Woof!","Are you happy now?","Yes, I’m so happy.","Thank you, Lingling.","I’m happy, too."]},{"title":"听一听并找一找","label":"Listen and find","lines":["Maomao is sad.","He can’t find Danny.","Danny is brown with a black nose.","Don’t cry. Let’s look for him together.","Lingling comes.","She helps Maomao look for Danny.","Lingling and Maomao find Danny.","They are all happy."]},{"title":"听、连一连并说一说","label":"Listen, match and talk","lines":["What’s the matter?","You look sad.","Don’t be sad.","Don’t cry.","Let’s look for it together.","What’s the matter, Grandpa?","Oh, I want to find my glasses.","But I can’t find them."]}]},{"id":"lesson-3","number":"03","title":"Let’s Take a Walk","subtitle":"我们去散步吧","pages":[11,12,13],"newWords":[{"en":"model","zh":"模型"},{"en":"plane","zh":"飞机"},{"en":"angry","zh":"生气的"},{"en":"better","zh":"更好地"},{"en":"calm down","zh":"冷静"},{"en":"fix","zh":"修理"}],"sections":[{"title":"课文正文","label":"Text","lines":["Mum!","What’s the matter?","Look at my new model plane!","Let me have a look.","That’s my favourite one!","Please don’t be angry.","Let’s take a walk.","How do you feel now?","I feel better, Mum.","That’s great!","A walk always helps me calm down.","I’m sorry, Mike.","I just want to play with you.","It’s OK.","Let’s fix it together."]},{"title":"听一听并找一找","label":"Listen and find","lines":["Mike is angry.","calm down","shout at his brother","talk with his mum","take a walk","fix the model plane with his brother","Everyone is happy."]},{"title":"听、勾一勾并说一说","label":"Listen, tick and say","lines":["What do I do to calm down?","listen to music","talk to a friend","shout","take a walk","count from one to ten","What do you do to calm down?","Who is angry?","Can you help him calm down?","Calm down.","Don’t be angry."]}]},{"id":"lesson-4","number":"04","title":"Yoyo and Joe","subtitle":"Yoyo 和 Joe","pages":[14,15,16],"newWords":[{"en":"his","zh":"他的"},{"en":"mouse","zh":"老鼠"},{"en":"come","zh":"来"},{"en":"have","zh":"有"},{"en":"idea","zh":"主意"},{"en":"stop","zh":"停止"},{"en":"but","zh":"但是"}],"sections":[{"title":"故事正文","label":"Story","lines":["It is a sunny day.","Yoyo, the bear, and his friend Joe, the little mouse, are happy.","I love sunny days!","Me, too.","Here comes the wind.","Yoyo is not happy.","I don’t like windy days.","I have an idea.","Let’s fly a kite.","Yoyo gets happy again.","I love windy days now.","Here comes the rain.","Yoyo gets angry.","I don’t like rainy days!","Calm down.","I have an idea.","Yoyo is excited.","Hooray!","I love rainy days now.","The rain stops.","The sun comes out.","It is a sunny day again!","But now I know every day could be fun.","Thank you, Joe!"]},{"title":"课后活动","label":"Activities","lines":["What’s Joe’s idea?","Listen to the story, then think and talk.","Let’s make paper boats.","What is your idea?","Act out the story.","I don’t like windy days.","I’m not happy.","Let’s fly a kite.","I’m happy now.","Thank you!","Why does Yoyo say ‘Thank you, Joe!’ at the end?"]},{"title":"单元项目","label":"Project","lines":["Keep a feeling note.","Put the feelings in the right places.","Write down your feelings for last week.","Share your feelings with your friends.","How do you feel on Tuesday?","I feel worried.","What’s the matter?","Don’t worry.","I can write down and share my feelings."]}]},{"id":"sounds","number":"Aa Ee","title":"Letters and Sounds","subtitle":"字母与发音","pages":[17],"newWords":[],"sections":[{"title":"韵律歌","label":"Let’s chant","lines":["Wake! Wake!","Let’s make a cake.","Put a grape on top of the cake.","You and me, he and she, with Chinese tea.","How happy we would be!"]},{"title":"听一听并跟读","label":"Listen and repeat","lines":["wake","make","cake","grape","take","me","he","she","Chinese","be","these"]},{"title":"听、勾一勾并朗读","label":"Listen, tick, read aloud and write","lines":["Kate","cat","be","bed","plane","plan","he","hen","Let’s make a cake for you and me."]}]}];

const app=document.getElementById("app");
const state={lessonId:"lesson-1",sectionIndex:0,mode:"sentences",rate:.86,locale:"en-GB",activeText:"",lastText:"",continuous:false,pageOpen:false,pageIndex:0,notice:"",voiceLabel:"正在识别设备语音…",recordingKey:"",recordings:{}};
let stopToken=0,speechResolver=null,voices=[],recorder=null,chunks=[];
const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lesson=()=>LESSONS.find(x=>x.id===state.lessonId);
const section=()=>lesson().sections[state.sectionIndex]||lesson().sections[0];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function selectVoice(lang=state.locale){const zh=lang==="zh-CN";const names=zh?["xiaoxiao","yunxi","huihui","ting-ting","mandarin","普通话","中文"]:lang==="en-GB"?["google uk english female","google uk english male","sonia","libby","ryan","daniel","serena","kate","english united kingdom","british"]:["aria","jenny","samantha","google us english","david","zira","english united states"];const list=voices.filter(v=>v.lang.toLowerCase().startsWith(zh?"zh":"en"));return list.sort((a,b)=>score(b)-score(a))[0]||null;function score(v){const n=v.name.toLowerCase(),l=v.lang.toLowerCase(),t=lang.toLowerCase();return(v.localService?5:0)+(l===t?35:0)+(l.startsWith(t)?12:0)+names.reduce((s,x,i)=>s+(n.includes(x)?28-i:0),0)}}
function loadVoices(){if(!("speechSynthesis" in window)){state.voiceLabel="当前浏览器不支持系统朗读";render();return}voices=speechSynthesis.getVoices();state.voiceLabel=selectVoice()?.name||"设备默认英语语音";render()}
function stopSpeaking(){stopToken++;speechSynthesis?.cancel();speechResolver?.();speechResolver=null;state.continuous=false;state.activeText="";render()}
function utter(text,lang=state.locale){return new Promise(resolve=>{if(!("speechSynthesis" in window)){state.notice="当前浏览器不支持系统朗读，请使用华为浏览器或 Chrome。";render();resolve();return}const u=new SpeechSynthesisUtterance(text),zh=lang==="zh-CN";u.lang=lang;u.rate=zh?.88:state.rate;u.pitch=zh?1:.98;u.volume=1;u.voice=selectVoice(lang);if(!zh)state.voiceLabel=u.voice?.name||"设备默认英语语音";const done=()=>{speechResolver=null;resolve()};speechResolver=done;u.onend=done;u.onerror=done;speechSynthesis.speak(u)})}
async function speak(text,lang=state.locale){stopSpeaking();const token=stopToken;state.activeText=text;state.lastText=text;render();await utter(text,lang);if(token===stopToken){state.activeText="";render()}}
async function continuous(){stopSpeaking();const token=stopToken;state.continuous=true;render();while(token===stopToken){for(const line of section().lines){if(token!==stopToken)return;state.activeText=line;state.lastText=line;render();await utter(line);await sleep(650)}}}
async function toggleRecording(line,index){if(state.recordingKey){recorder?.stop();return}if(!navigator.mediaDevices?.getUserMedia||!("MediaRecorder" in window)){state.notice="当前浏览器不支持录音；点读功能仍可正常使用。";render();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);const key=lesson().id+":"+state.sectionIndex+":"+index;recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{state.recordings[key]=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||"audio/webm"}));stream.getTracks().forEach(t=>t.stop());state.recordingKey="";render()};recorder.start();state.recordingKey=key;state.notice="正在录音，再点一次‘结束’即可保存跟读。";render()}catch{state.notice="没有获得麦克风权限；其他点读功能可以正常使用。";render()}}
function chooseLesson(id){stopSpeaking();state.lessonId=id;state.sectionIndex=0;state.mode="sentences";state.pageIndex=0;state.lastText="";render();scrollTo({top:0,behavior:"smooth"})}
function sentencePanel(l,s){return `<nav class="section-tabs" aria-label="本课栏目">${l.sections.map((x,i)=>`<button data-section="${i}" class="${i===state.sectionIndex?"active":""}"><span>${esc(x.label)}</span>${esc(x.title)}</button>`).join("")}</nav><section class="content-card"><div class="content-title"><div><p>${esc(s.label)}</p><h3>${esc(s.title)}</h3></div><div class="play-controls"><button class="play-all" data-action="continuous" ${state.continuous?"disabled":""}>▶ 循环连读</button><button class="stop-button" data-action="stop">■ 停止</button><button class="repeat-button" data-action="repeat" ${!state.lastText||state.continuous?"disabled":""}>↻ 重复本句</button></div></div><div class="line-list ${state.sectionIndex===0?"passage":""}">${s.lines.map((line,i)=>{const key=l.id+":"+state.sectionIndex+":"+i;return `<div class="line ${state.activeText===line?"speaking":""}"><button class="line-main" data-line="${i}" aria-label="播放：${esc(line)}"><span class="play">${state.activeText===line?"▮▮":"▶"}</span><span><small>${String(i+1).padStart(2,"0")}</small>${esc(line)}</span></button><button class="record ${state.recordingKey===key?"recording":""}" data-record="${i}">●<small>${state.recordingKey===key?"结束":"跟读"}</small></button>${state.recordings[key]?`<button class="replay" data-replay="${esc(key)}">↻<small>回听</small></button>`:""}</div>`}).join("")}</div></section>`}
function wordPanel(words){return `<section class="content-card word-card"><div class="content-title"><div><p>WORD LIST</p><h3>教材课后新词</h3></div><span class="word-count">本课 ${words.length} 个新词</span></div><p class="word-tip">点击英文听清晰发音；点击中文释义听流畅普通话。</p><div class="word-grid">${words.map((w,i)=>`<div class="word ${state.activeText===w.en?"active":""}"><button class="word-en" data-word="${i}"><span>▶</span>${esc(w.en)}</button><button class="word-zh" data-zh="${i}">${esc(w.zh)}<span>普通话</span></button></div>`).join("")}</div></section>`}
function pageModal(l){const p=l.pages[state.pageIndex];return `<div class="modal"><button class="modal-close" data-action="close-page">×</button><div class="modal-bar"><button data-action="prev-page" ${state.pageIndex===0?"disabled":""}>← 上一页</button><strong>教材第 ${p-3} 页</strong><button data-action="next-page" ${state.pageIndex===l.pages.length-1?"disabled":""}>下一页 →</button></div><img src="textbook/page-${String(p).padStart(2,"0")}.jpg" alt="${esc(l.title)} 教材原页"></div>`}
function render(){const l=lesson(),s=section(),words=l.newWords,total=LESSONS.slice(0,4).reduce((n,x)=>n+x.sections.flatMap(y=>y.lines).length,0);app.innerHTML=`<header class="topbar"><div class="brand-mark">E</div><div class="brand-copy"><strong>朝阳英语点读</strong><span>四年级 · 上册 · Unit One</span></div><span class="web-badge">网页版</span><button class="text-button" data-action="open-page">教材原页</button></header><section class="hero"><div><p class="eyebrow">UNIT ONE · SHARE AND CARE</p><h1>整篇连读，<em>随时暂停</em></h1><p>不点停止就循环朗读；停止后可重复刚才那一句。</p></div><div class="hero-stats"><span><b>4</b>课</span><span><b>${total}</b>句</span><span><b>1</b>发音专项</span></div></section><nav class="lesson-tabs">${LESSONS.map(x=>`<button data-lesson="${esc(x.id)}" class="${x.id===l.id?"active":""}"><span>${esc(x.number)}</span>${esc(x.title)}</button>`).join("")}</nav><section class="lesson-head"><div><p class="lesson-no">LESSON ${esc(l.number)}</p><h2>${esc(l.title)}</h2><p>${esc(l.subtitle)}</p></div><button class="page-button" data-action="open-page"><span>▧</span> 对照原页</button></section><section class="control-dock"><div class="segmented"><button data-mode="sentences" class="${state.mode==="sentences"?"active":""}">课文与练习</button><button data-mode="words" ${words.length?"":"disabled"} class="${state.mode==="words"?"active":""}">教材新词 · ${words.length}</button></div><div class="settings"><label>教材口音<select id="locale"><option value="en-GB" ${state.locale==="en-GB"?"selected":""}>英式（推荐）</option><option value="en-US" ${state.locale==="en-US"?"selected":""}>美式（备用）</option></select></label><label>朗读速度<select id="rate"><option value=".72" ${state.rate===.72?"selected":""}>逐词慢速</option><option value=".86" ${state.rate===.86?"selected":""}>教材慢速</option><option value="1" ${state.rate===1?"selected":""}>自然语速</option></select></label><div class="voice-tests"><button data-action="test-en">试听英语</button><button data-action="test-zh">试听普通话</button></div><small class="voice-name">当前：${esc(state.voiceLabel)}</small></div></section>${state.mode==="sentences"?sentencePanel(l,s):wordPanel(words)}<footer><strong>内容来源</strong><span>北京市义务教育教科书《英语》四年级上册 · 用户提供页 1—14</span><button data-action="top">返回顶部 ↑</button></footer>${state.notice?`<div class="toast"><span>${esc(state.notice)}</span><button data-action="dismiss">×</button></div>`:""}${state.pageOpen?pageModal(l):""}`}
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.lesson){chooseLesson(b.dataset.lesson);return}if(b.dataset.section!==undefined){stopSpeaking();state.sectionIndex=Number(b.dataset.section);state.lastText="";render();return}if(b.dataset.mode){state.mode=b.dataset.mode;render();return}if(b.dataset.line!==undefined){speak(section().lines[Number(b.dataset.line)]);return}if(b.dataset.word!==undefined){speak(lesson().newWords[Number(b.dataset.word)].en);return}if(b.dataset.zh!==undefined){speak(lesson().newWords[Number(b.dataset.zh)].zh,"zh-CN");return}if(b.dataset.record!==undefined){toggleRecording(section().lines[Number(b.dataset.record)],Number(b.dataset.record));return}if(b.dataset.replay){new Audio(state.recordings[b.dataset.replay]).play();return}const a=b.dataset.action;if(a==="continuous")continuous();else if(a==="stop")stopSpeaking();else if(a==="repeat"&&state.lastText)speak(state.lastText);else if(a==="test-en")speak("Welcome back to school. How do you feel today?");else if(a==="test-zh")speak("请听清楚，然后大声跟读。","zh-CN");else if(a==="open-page"){state.pageOpen=true;state.pageIndex=0;render()}else if(a==="close-page"){state.pageOpen=false;render()}else if(a==="prev-page"){state.pageIndex--;render()}else if(a==="next-page"){state.pageIndex++;render()}else if(a==="dismiss"){state.notice="";render()}else if(a==="top")scrollTo({top:0,behavior:"smooth"})});
app.addEventListener("change",e=>{if(e.target.id==="locale")state.locale=e.target.value;if(e.target.id==="rate")state.rate=Number(e.target.value);render()});
speechSynthesis?.addEventListener?.("voiceschanged",loadVoices);render();loadVoices();
</script></body></html>
