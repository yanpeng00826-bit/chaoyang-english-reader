k about New Year’s Day, the Spring Festival and the Lantern Festival."]}]},{"id":"reading","number":"Read","title":"Be Friends, Be Happy","subtitle":"做朋友，享快乐","pages":[97],"unit":"Reading","unitTitle":"Reading for Pleasure","newWords":[],"sections":[{"title":"趣味阅读","label":"Reading for Pleasure","lines":["In the blue sea, Mark, the big fish, lives with his best friend, Chart.","One day, Mark finds a small green thing and puts it in his mouth.","Suddenly, he becomes super smart.","Mark swims to find Chart.","Chart is playing a word game.","Mark comes and quickly gives all the answers.","“This is fun!”","Mark is so excited.","“Not really,” says Chart.","He is not happy, and goes home.","Mark is a little sad.","He goes to talk to Chart.","“Are you mad at me?” asks Mark.","“No,” says Chart, “But the game is not fun when you tell me all the answers.”","“I want to find the answers on my own.”","“You’re right. I’m so sorry,” says Mark.","Chart is happy.","Mark gets happy too.","Answer the following question.","Is Mark a good friend? Why or why not?"]}]}],"translations":{"Dad, I’m a little worried. Am I late?":"爸爸，我有点担心。我迟到了吗？","Don’t worry. You’re just in time.":"别担心。你来得正是时候。","Welcome back to school!":"欢迎回到学校！","How do you feel today?":"你今天感觉怎么样？","Thank you, Miss Wang.":"谢谢您，王老师。","We are so happy.":"我们非常开心。","Wow, I’m so excited.":"哇，我太兴奋了。","Look at our new classroom.":"看看我们的新教室。","It’s big and cool.":"它又大又漂亮。","Yes, it is!":"是的，确实如此！","How do the students feel today?":"同学们今天感觉怎么样？","happy":"开心的","worried":"担心的","excited":"兴奋的","Dad, am I late?":"爸爸，我迟到了吗？","Mike is worried.":"迈克很担心。","We’re so happy, Miss Wang.":"王老师，我们非常开心。","Lingling is happy.":"玲玲很开心。","Wow, look at our new classroom.":"哇，看看我们的新教室。","Guoguo is excited.":"果果很兴奋。","How do the students feel?":"同学们感觉怎么样？","Look! There are three cats in our classroom.":"看！我们的教室里有三只猫。","Look! Yoyo, a bee is on your nose.":"看！悠悠，有一只蜜蜂落在你的鼻子上。","Don’t worry. She’s my new friend.":"别担心。她是我的新朋友。","Don’t worry.":"别担心。","Oh, n function selectVoice(lang=state.locale){
  const male=["male","男","ryan","daniel","george","oliver","arthur","thomas","james","david","guy","christopher","eric","roger","davis"];
  const female=["female","女","sonia","libby","serena","kate","aria","jenny","samantha","zira"];
  const candidates=voices.filter(v=>v.lang.toLowerCase().startsWith("en"));
  return candidates.sort((a,b)=>score(b)-score(a))[0]||null;
  function score(v){const n=v.name.toLowerCase(),l=v.lang.toLowerCase();return(v.localService?5:0)+(l===lang.toLowerCase()?35:0)+(male.some(x=>n.includes(x))?70:0)-(female.some(x=>n.includes(x))?60:0)}

 ${state.pageOpen?pageModal(l):""}`;
}
function sentences(l,s){return `<nav class="section-tabs">${l.sections.map((x,i)=>`<button data-section="${i}" class="${i===state.sectionIndex?"active":""}"><span>${esc(x.label)}</span>${esc(x.title)}</button>`).join("")}</nav><section class="content-card"><div class="content-title"><div><p>${esc(s.label)}</p><h3>${esc(s.title)}</h3></div><div class="play-controls"><button class="play-all" data-action="continuous" ${state.continuous?"disabled":""}>▶ 循环连读</button><button class="stop-button" data-action="stop">■ 停止</button><button class="repeat-button" data-action="repeat" ${!state.lastText||state.continuous?"disabled":""}>↻ 重复本句</button></div></div><div class="line-list ${state.sectionIndex===0?"passage":""}">${s.lines.map((line,i)=>{const key=l.id+":"+state.sectionIndex+":"+i;return `<div class="line ${state.activeText===line?"speaking":""}"><div class="line-body"><button class="line-main" data-line="${i}"><span class="play">${state.activeText===line?"▮▮":"▶"}</span><span><small>${String(i+1).padStart(2,"0")}</small>${esc(line)}</span></button><p class="translation">${esc(DATA.translations[line])}</p></div><button class="record ${state.recordingKey===key?"recording":""}" data-record="${i}">●<small>${state.recordingKey===key?"结束":"跟读"}</small></button>${state.recordings[key]?`<button class="replay" data-replay="${esc(key)}">↻<small>回听</small></button>`:""}</div>`}).join("")}</div></section>`}
function wordList(words){return `<section class="content-card word-card"><div class="content-title"><div><p>WORD LIST</p><h3>教材课后新词</h3></div><span class="word-count">本课 ${words.length} 个新词</span></div><p class="word-tip">点击英文听清晰发音；中文释义只显示，不朗读。</p><div class="word-grid">${words.map((w,i)=>`<div class="word ${state.activeText===w.en?"active":""}"><button class="word-en" data-word="${i}"><span>▶</span>${esc(w.en)}</button><div class="word-zh">${esc(w.zh)}<span>中文释义</span></div></div>`).join("")}</div></section>`}
function pageModal(l){const p=l.pages[state.pageIndex];return `<div class="modal"><button class="modal-close" data-action="close-page">×</button><div class="modal-bar"><button data-action="prev-page" ${state.pageIndex===0?"disabled":""}>← 上一页</button><strong>教材图片第 ${p} 页</strong><button data-action="next-page" ${state.pageIndex===l.pages.length-1?"disabled":""}>下一页 →</button></div><img src="${PAGE_IMAGES[p]}" alt="${esc(l.title)} 教材原页"></div>`}
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.unit){const first=DATA.lessons.find(x=>x.unit===b.dataset.unit);if(first)chooseLesson(first.id);return}if(b.dataset.lesson){chooseLesson(b.dataset.lesson);return}if(b.dataset.section!==undefined){stopSpeaking();state.sectionIndex=Number(b.dataset.section);state.lastText="";render();return}if(b.dataset.mode){state.mode=b.dataset.mode;render();return}if(b.dataset.line!==undefined){speak(section().lines[Number(b.dataset.line)]);return}if(b.dataset.word!==undefined){speak(lesson().newWords[Number(b.dataset.word)].en);return}if(b.dataset.record!==undefined){toggleRecording(section().lines[Number(b.dataset.record)],Number(b.dataset.record));return}if(b.dataset.replay){new Audio(state.recordings[b.dataset.replay]).play();return}const a=b.dataset.action;if(a==="continuous")continuous();else if(a==="stop")stopSpeaking();else if(a==="repeat"&&state.lastText)speak(state.lastText);else if(a==="test")speak("Welcome back to school. How do you feel today?");else if(a==="open-page"){state.pageOpen=true;state.pageIndex=0;render()}else if(a==="close-page"){state.pageOpen=false;render()}else if(a==="prev-page"){state.pageIndex--;render()}else if(a==="next-page"){state.pageIndex++;render()}else if(a==="dismiss"){state.notice="";render()}else if(a==="top")scrollTo({top:0,behavior:"smooth"})});
app.addEventListener("change",e=>{if(e.target.id==="locale")state.locale=e.target.value;if(e.target.id==="rate")state.rate=Number(e.target.value);render()});
speechSynthesis?.addEventListener?.("voiceschanged",loadVoices);render();loadVoices();
</script></body></html>
